ext {
    compileSdkVersion = project.hasProperty('compileSdkVersion') ? project.compileSdkVersion : 35
    minSdkVersion = project.hasProperty('minSdkVersion') ? project.minSdkVersion : 26
    targetSdkVersion = project.hasProperty('targetSdkVersion') ? project.targetSdkVersion : 35
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace "io.github.abc15018045126.sora"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                'sora-editor/editor/src/main/java',
                'sora-editor/language-textmate/src/main/java',
                'sora-editor/oniguruma-native/src/main/java'
            ]
            res.srcDirs = [
                'src/main/res',
                'sora-editor/editor/src/main/res',
                'sora-editor/language-textmate/src/main/res',
                'sora-editor/oniguruma-native/src/main/res'
            ]
            assets.srcDirs = [
                'src/main/assets',
                'sora-editor/editor/src/main/assets',
                'sora-editor/language-textmate/src/main/assets',
                'sora-editor/oniguruma-native/src/main/assets'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path = file("sora-editor/oniguruma-native/src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    
    // Required NDK version for Oniguruma-native
    ndkVersion = "29.0.14206865"
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    
    // Core Android dependencies
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.collection:collection:1.4.5"
    
    // Editor dependencies (extracted from sora-editor modules)
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "org.snakeyaml:snakeyaml-engine:3.0.1"
    implementation "org.eclipse.jdt:org.eclipse.jdt.annotation:2.4.100"
    
    // Textmate engine components
    implementation "org.jruby.jcodings:jcodings:1.0.63"
    implementation "org.jruby.joni:joni:2.2.6"

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
}
